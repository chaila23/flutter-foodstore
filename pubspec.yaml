name: flutter_foodstore
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  either_dart: ^1.0.0
  flutter_bloc: ^9.1.1
  flutter_secure_storage: ^11.2.0
  flutter_widget_from_html: ^0.17.4
  freezed_annotation: ^3.1.0
  go_router: ^18.0.1
  image_picker: ^1.2.3
  webview_flutter: ^4.14.1
  flutter_rating_bar: ^4.0.1
  intl: ^0.20.3
  dartz: ^0.10.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  freezed: ^4.0.2

flutter:
  uses-material-design: true

  assets:
    - assets/images/